# wlshare configuration: $XDG_CONFIG_HOME/wlshare/config.toml by default.
# Every top-level key and table is optional; the values shown are the defaults
# unless noted. An enabled [password] table requires its hash.

# Where clients connect. Without [pam] or [password] below the session is
# unauthenticated and not encrypted: keep this on loopback or a VPN address, or
# put an SSH tunnel in front.
listen = "127.0.0.1:5900"

# Who may connect: a login over RSA-AES from one of the two tables below, or --
# with both left out -- anyone who reaches the port. Set one table or the other,
# never both. Classic VncAuth is not offered: it names nobody, cuts the password
# to eight characters, and leaves the session in the clear.
#
# RSA-AES with the system login: the client sends the username and password of
# the account wlshare runs as -- no other account is accepted -- and PAM checks
# them under the service below (/etc/pam.d/wlshare, installed with the package).
# Every byte after the key exchange is encrypted. The server's RSA key is
# generated on first start and kept in rsa_key_file; its fingerprint is logged
# at startup, and a remotex gateway logs the one it saw, for comparing.
# [pam]
# service = "wlshare"
# rsa_key_file = "/home/me/.config/wlshare/rsa_key.pem"   # default: beside this file

# RSA-AES with one password of your own and no account at all: the client is
# asked for a password alone, and it is checked against the Argon2 hash below.
# For a host where no system account's password should be the way in. Print the
# hash with `wlshare hash-password`, which asks for the password and never
# writes it anywhere; the same rsa_key_file applies.
# [password]
# hash = "$argon2id$v=19$m=19456,t=2,p=1$c29tZXNhbHQ$..."
# rsa_key_file = "/home/me/.config/wlshare/rsa_key.pem"   # default: beside this file

# The output to share, by its Wayland `wl_output` name. Absent means the first
# output the compositor lists. Only a HEADLESS-* output is ever resized or
# rescaled for a client.
# output = "HEADLESS-1"

# Whether clients may resize the output and set its scale.
resize = true

# The most frames captured per second.
max_fps = 60

# Seconds a connection has to finish the handshake — the security exchange and
# the login — before it is dropped. A client that shows its user the server key
# to confirm and then asks for a password (TigerVNC does both on every
# connection) spends most of this waiting on the person.
handshake_timeout_secs = 120

# Whether a client may hear the desktop; off by default. While a client that asks for wlshare's
# audio extension (the remotex gateway, in a session started with sound) has it
# enabled, wlshare adds a PipeWire sink of its own, "wlshare remote audio", and
# makes it the default: every stream that follows the default plays there and is
# silent on the host, and one an application pinned to a sink of the host's is
# still heard on it. What that sink plays is sent in the sample format the client
# chose, encoded as FLAC or as Opus, whichever the client asked for. When the last client stops listening the sink goes and
# the host's own is the default again. A headless session needs no sink of its
# own: wlshare's is one.
audio = false

# Whether a client may lend the desktop its camera; off by default. A client that asks for the
# camera extension (the remotex gateway, for a target with camera = true) plugs
# its browser's camera and sends H.264, which becomes a PipeWire video source
# named "wlshare remote camera" -- one that applications reaching cameras through
# PipeWire (a browser's camera portal, OBS, GStreamer) can open. It sends frames
# only while one of them has it open.
camera = false

# Whether a client may lend the desktop its microphone; off by default. A client that asks for
# the microphone extension plugs its microphone, which becomes a PipeWire audio
# source named "wlshare remote microphone" that applications record from like
# any other. The client sends 16-bit PCM only while one of them is recording.
microphone = false

# The desktop name clients see.
name = "wlshare"

# A Unix socket that tells whoever connects whether a client is on the desktop:
# one line, `held` or `free`, and another each time that changes. Under
# $XDG_RUNTIME_DIR when the path is relative; only the account the daemon runs
# as can connect. A takeover is the desktop passing from one client to another
# and is not a change. Absent means no socket.
#
# The socket closes when the daemon is gone, however it went, and that is what
# it is for: `wlshare watch` follows it from a process of its own, reads a
# daemon it cannot reach as a desktop nobody holds, and runs a command for each
# of the two through `sh -c`:
#
#   wlshare watch --held "..." --free "..." [--free-after-secs 5] [--timeout-secs 60]
#
# --held runs when a client is on the desktop and --free when nobody has been
# for --free-after-secs, so neither runs for a client that leaves and reconnects
# inside the wait, nor for a daemon restarted inside it. The first to run is the
# one for where the desktop stands when the watcher starts, so both have to be
# safe to run twice. One runs at a time, for at most --timeout-secs before it is
# killed. A watcher stopped while the desktop is held runs --free before it
# exits.
#
# The case it is for: a sway session whose windows should move onto the
# headless output a remote client is shown while the monitors go dark, and
# back when it leaves. With `output = "HEADLESS-1"` above and a headless output
# created at session start (`swaymsg create_output`, placed where no monitor is
# adjacent), the watcher is started by the session, from a user unit beside
# wlshare's or with sway's `exec`:
#
#   wlshare watch \
#       --held "swaymsg 'output DP-1 disable, output DP-2 disable'" \
#       --free "swaymsg 'output DP-1 enable, output DP-2 enable'"
#
# since sway moves a disabled output's workspaces to an enabled one. A desktop
# left dark is recovered the same way from a console or over SSH, with SWAYSOCK
# set: `swaymsg 'output * enable'`.
# state_socket = "wlshare/state.sock"

# The keymap the virtual keyboard uploads and keysyms are resolved through, as
# XKB rules/model/layout/variant/options names. Empty means the library default.
# A custom layout directory is named by XKB_CONFIG_EXTRA_PATH in the environment.
[xkb]
# rules = ""
# model = ""
# layout = "us"
# variant = ""
# options = ""
