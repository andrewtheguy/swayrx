[package]
name = "wlshare"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A VNC server for wlroots-based Wayland compositors that reports pixel density to the remotex gateway"

[[bin]]
name = "wlshare"
path = "src/main.rs"

[dependencies]
wlshare-rfb = { path = "../wlshare-rfb" }
# The quality walk, the same one the remotex gateway runs on its own streams.
desktop-vp9 = { git = "https://github.com/andrewtheguy/desktop-vp9", tag = "v0.0.2" }
anyhow.workspace = true
log.workspace = true
thiserror.workspace = true
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

# The Wayland side. wayland-client dlopens libwayland-client at runtime.
wayland-client = { version = "0.31", features = ["log"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
# The keymap the virtual keyboard uploads, and the keysym -> keycode lookup.
xkbcommon = "0.9"
# wl_shm buffers: a memfd, mapped.
rustix = { version = "1", features = ["fs", "mm", "pipe"] }
memmap2 = "0.9"
# The PAM conversation's allocations and the process's passwd entry (pam.rs).
libc = "0.2"
# The desktop's sound, and the client's camera and microphone as nodes; 0.3.34 is
# where a driving stream can be told a frame is ready (trigger_process), and
# 0.3.49 where a buffer says how many frames the graph wants of the microphone.
pipewire = { version = "0.10", features = ["v0_3_49"] }
# The client's camera arrives as H.264, decoded by the system's libavcodec,
# linked dynamically; avcodec alone, since nothing here demuxes or scales.
ffmpeg-sys-next = { version = "7.1", default-features = false, features = ["avcodec"] }
# The [password] table's hash: Argon2id and the PHC string it is stored as.
argon2 = "0.6"

# `cargo deb -p wlshare` (scripts/build-debs.sh runs it in Docker per architecture;
# the package version is the crate's, and the file is named wlshare-trixie-<arch>.deb).
[package.metadata.deb]
name = "wlshare"
maintainer = "Andrew Chen <andrew@jaanuu.com>"
extended-description = """A VNC server for wlroots-based Wayland compositors that captures one output through
wlr-screencopy, serves it over RFB 3.8 with ZRLE, reports the output's
pixel density to the remotex gateway over a private extension, and offers the
desktop's applications a camera and a microphone fed from the client's."""
section = "net"
priority = "optional"
# libpipewire, libpam and libavcodec/libavutil (the camera's H.264 decoder) are
# linked, so $auto names them from the binary.
# wayland-client loads libwayland-client at runtime, so dpkg-shlibdeps cannot see it.
# wlroots is the compositor's, not linked here: 0.19 is the first whose headless
# backend keeps the cursor out of a screencopy without overlay_cursor.
# libpipewire is only the client library: the speaker, the camera and the
# microphone are nodes in a graph the session's PipeWire server runs. Trixie's
# `pipewire` is that server alone, with no session manager to make the speaker
# the default or link anything to it, and no PulseAudio server for most
# applications to play through, so wireplumber and pipewire-pulse come with it.
depends = "$auto, libwayland-client0 (>= 1.20), libwlroots-0.19 (>= 0.19.0), pipewire, wireplumber, pipewire-pulse"
# The PAM stack an RSA-AES login is checked against; a conffile, so an operator's
# edits survive an upgrade.
conf-files = ["/etc/pam.d/wlshare"]
assets = [
    ["target/release/wlshare", "usr/bin/", "755"],
    ["../../packaging/wlshare.service", "usr/lib/systemd/user/", "644"],
    ["../../packaging/pam.d/wlshare", "etc/pam.d/", "644"],
    ["../../packaging/config.example.toml", "usr/share/doc/wlshare/", "644"],
    ["../../README.md", "usr/share/doc/wlshare/", "644"],
    ["../../docs/architecture.md", "usr/share/doc/wlshare/", "644"],
]
