[package]
name = "wlshare-rfb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The RFB wire wlshare speaks: message parsing and building, RSA-AES, the ZRLE encoder, the VP9 encoding, the FLAC audio and the private extensions"

# Platform-independent and dependency-light on purpose: this crate is where the
# bytes on the wire are decided, and it must build and unit-test on any OS,
# because the daemon crate never does off a Wayland session.
[dependencies]
thiserror.workspace = true
# ZRLE's per-client deflate stream. zlib-rs is the fastest backend and pure Rust.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# RSA-AES: the async reader and writer the exchange and its frames run over.
tokio = { version = "1", default-features = false, features = ["io-util"] }
# RSA-AES: RSA-PKCS#1 v1.5 around the two randoms, with `encoding` for the
# PKCS#8 PEM the server's key file holds; SHA-1 and SHA-256 for the two types'
# key derivation and the fingerprint; AES-EAX for every byte after. The
# release-candidate `rsa` is the line on `rand_core` 0.10 and `digest` 0.11.
rsa = { version = "0.10.0-rc.18", default-features = false, features = ["std", "encoding", "hazmat"] }
subtle = { version = "2.6", default-features = false }
pkcs8 = { version = "0.11", default-features = false, features = ["pem", "std"] }
rand = "0.10"
aes = "0.9"
eax = "0.6"
sha1 = "0.11"
sha2 = "0.11"
# The audio extension's FLAC frames. Pure Rust; without its default features,
# so no worker threads, serde or logging come with it.
flacenc = { version = "0.5", default-features = false }
# The VP9 encoding's codec: the one place libvpx is spoken to, for this
# workspace and for the remotex gateway, each pinned to its release tag.
desktop-vp9 = { git = "https://github.com/andrewtheguy/desktop-vp9", tag = "v0.0.5" }

[dev-dependencies]
# The FLAC encoder's tests read every frame back with symphonia's decoder,
# which shares nothing with flacenc: pure Rust, and only the FLAC bundle of it
# — `symphonia-core` for the decoder trait and the packet it takes.
symphonia-bundle-flac = "0.6"
symphonia-core = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
