[package]
name = "wlshare-rfb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The RFB wire wlshare speaks: message parsing and building, RSA-AES, the ZRLE encoder, the VP9 encoding, the FLAC audio and the private extensions"

# Platform-independent and dependency-light on purpose: this crate is where the
# bytes on the wire are decided, and it must build and unit-test on any OS,
# because the daemon crate never does off a Wayland session.
[dependencies]
thiserror.workspace = true
# ZRLE's per-client deflate stream. zlib-rs is the fastest backend and pure Rust.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# RSA-AES: the async reader and writer the exchange and its frames run over.
tokio = { version = "1", default-features = false, features = ["io-util"] }
# RSA-AES: RSA-PKCS#1 v1.5 around the two randoms, with `encoding` for the
# PKCS#8 PEM the server's key file holds; SHA-1 and SHA-256 for the two types'
# key derivation and the fingerprint; AES-EAX for every byte after. The
# release-candidate `rsa` is the line on `rand_core` 0.10 and `digest` 0.11.
rsa = { version = "0.10.0-rc.18", default-features = false, features = ["std", "encoding", "hazmat"] }
subtle = { version = "2.6", default-features = false }
pkcs8 = { version = "0.11", default-features = false, features = ["pem", "std"] }
rand = "0.10"
aes = "0.9"
eax = "0.6"
sha1 = "0.11"
sha2 = "0.11"
# The audio extension's FLAC frames, behind `encode`. Pure Rust; without its
# default features, so no worker threads, serde or logging come with it.
flacenc = { version = "0.5", default-features = false, optional = true }
# The client's end of the same frames, behind `decode`: symphonia's decoder,
# pure Rust, and only the FLAC bundle of it — `symphonia-core` for the decoder
# trait and the packet it takes.
symphonia-bundle-flac = { version = "0.6", optional = true }
symphonia-core = { version = "0.6", optional = true }
# The VP9 encoding's codec, behind both features: the one place libvpx is
# spoken to, for this workspace and for the remotex gateway, which pulls it from
# this repository by git.
wlshare-vp9 = { path = "../wlshare-vp9", optional = true }

[features]
# The server's FLAC encoder, `audio::FlacEncoder`, and VP9 encoder,
# `vp9::Vp9Encoder`. Off by default, so a client, which only decodes, does not
# build an encoder it never runs.
encode = ["dep:flacenc", "dep:wlshare-vp9"]
# The client's FLAC decoder, `audio::FlacDecoder`, and VP9 decoder,
# `vp9::Vp9Decoder`. Off by default, so the daemon, which only encodes, does not
# build a decoder it never runs.
decode = ["dep:symphonia-bundle-flac", "dep:symphonia-core", "dep:wlshare-vp9"]

[dev-dependencies]
# The encoder's tests read every frame back with the client's decoder, which
# shares nothing with flacenc, so they take both.
wlshare-rfb = { path = ".", features = ["encode", "decode"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
