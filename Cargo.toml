# The daemon and the protocol crate it is built on (see docs/architecture.md).
# The VP9 coding under both is desktop-vp9, the FLAC coding desktop-flac and the
# Opus coding desktop-opus, each its own repository.
#
# `default-members` deliberately omits the daemon: it needs libwayland and
# libxkbcommon and only runs against a Wayland compositor, so a bare
# `cargo test` on a development machine of any OS exercises the protocol crate
# and nothing else, its Opus tests with the ffmpeg that machine has installed.
# Build the daemon explicitly with `-p wlshare`.
[workspace]
members = ["crates/wlshare-rfb", "crates/wlshare"]
default-members = ["crates/wlshare-rfb"]
resolver = "3"

[workspace.package]
version = "0.0.49"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrewtheguy/wlshare"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
