# The daemon, the protocol crate it is built on, and the desktop client's
# session the macOS and Windows apps are built on (see docs/architecture.md).
#
# `default-members` deliberately omits the daemon: it needs libwayland and
# libxkbcommon and only runs against a Wayland compositor, so a bare
# `cargo test` on a development machine of any OS exercises the protocol crate
# and the client and nothing else. Build the daemon explicitly with `-p wlshare`.
[workspace]
members = ["crates/wlshare-vp9", "crates/wlshare-rfb", "crates/wlshare-client", "crates/wlshare"]
default-members = ["crates/wlshare-vp9", "crates/wlshare-rfb", "crates/wlshare-client"]
resolver = "3"

[workspace.package]
version = "0.0.41"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrewtheguy/wlshare"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
